spring.application.name=careerpath-ai

# Database Connection
spring.datasource.url=${DB_URL:jdbc:h2:mem:careerpath;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console for local inspection
spring.h2.console.enabled=true

# JWT settings
app.jwt.secret=${JWT_SECRET:change-me-please-32-chars-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
